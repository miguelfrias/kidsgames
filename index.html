<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0,  user-scalable=no" />
    <meta name="description" content="Some games for toddlers">
    <title>Kids Games</title>
    <script>
      // Automatically redirect legacy browsers without ES Modules (e.g. iPad Mini on iOS 9.3.5)
      if (!('noModule' in HTMLScriptElement.prototype)) {
        var loc = window.location;
        var p = loc.pathname;
        if (p.indexOf('.html') !== -1) {
          p = p.substring(0, p.lastIndexOf('/') + 1);
        } else if (p.charAt(p.length - 1) !== '/') {
          p = p + '/';
        }
        window.location.replace(loc.protocol + '//' + loc.host + p + 'mini/');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
